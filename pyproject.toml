[project]
name = "geminisummariser"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10"
dependencies = [
 "google-genai>=2.33.0",
 "python-dotenv>=1.0.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = ["E402", "F401"]

[tool.pyright]
reportPrivateImportUsage = false

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]
